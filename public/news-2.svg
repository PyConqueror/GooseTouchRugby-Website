<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#FEF9E7"/>
  
  <!-- Background design -->
  <rect x="0" y="0" width="400" height="200" fill="#F5F5F5"/>
  <rect x="20" y="20" width="360" height="160" rx="10" fill="white" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Rugby jersey display -->
  <path d="M200 40 L240 60 L240 140 L200 160 L160 140 L160 60 Z" fill="#F4D03F"/>
  <path d="M200 40 L200 160" stroke="white" stroke-width="4"/>
  <path d="M180 60 L220 60" stroke="white" stroke-width="4"/>
  
  <!-- Jersey number -->
  <text x="190" y="120" font-family="Arial" font-size="30" font-weight="bold" fill="white">7</text>
  
  <!-- Team logo on jersey -->
  <circle cx="200" cy="80" r="15" fill="white"/>
  <path d="M207 75C207 75 204 70 200 70C196 70 193 75 193 75C193 75 190 80 193 85C196 90 200 90 200 90C200 90 204 90 207 85C210 80 207 75 207 75Z" fill="#F4D03F"/>
  <circle cx="197" cy="77" r="2" fill="white"/>
  
  <!-- Shorts -->
  <rect x="180" y="170" width="40" height="20" rx="5" fill="#F4D03F"/>
  
  <!-- New tag -->
  <circle cx="320" cy="60" r="25" fill="#F39C12"/>
  <text x="305" y="65" font-family="Arial" font-size="12" font-weight="bold" fill="white">NEW</text>
  
  <!-- Hanger -->
  <path d="M200 10 L200 40" stroke="#A0A0A0" stroke-width="2"/>
  <path d="M180 10 L220 10" stroke="#A0A0A0" stroke-width="2"/>
</svg>
