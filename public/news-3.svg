  <line x1="200" y1="50" x2="200" y2="150" stroke="#F4D03F" stroke-width="1"/>
  <circle cx="200" cy="100" r="20" stroke="#F4D03F" stroke-width="1" fill="none"/>
  
  <!-- People silhouettes representing community -->
  <!-- Group 1 -->
  <circle cx="80" cy="80" r="8" fill="#F4D03F"/>
  <path d="M80 88 L80 110" stroke="#F4D03F" stroke-width="4"/>
  <path d="M70 95 L90 95" stroke="#F4D03F" stroke-width="4"/>
  <path d="M75 110 L70 120" stroke="#F4D03F" stroke-width="3"/>
  <path d="M85 110 L90 120" stroke="#F4D03F" stroke-width="3"/>
  
  <circle cx="110" cy="85" r="8" fill="#F4D03F"/>
