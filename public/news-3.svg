  <!-- Rugby ball -->
  <ellipse cx="200" cy="140" rx="15" ry="7.5" fill="#964B00" transform="rotate(-15 200 140)"/>
  
  <!-- Event banner -->
  <path d="M50 30 L350 30" stroke="#F4D03F" stroke-width="2"/>
  <text x="110" y="40" font-family="Arial" font-size="12" font-weight="bold" fill="#F4D03F">COMMUNITY RUGBY DAY</text>
  
  <!-- Success badge -->
  <circle cx="340" cy="160" r="20" fill="#F4D03F"/>
  <text x="330" y="165" font-family="Arial" font-size="10" font-weight="bold" fill="white">200+</text>
