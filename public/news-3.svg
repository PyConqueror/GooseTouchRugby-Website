  <path d="M146 100 L142 110" stroke="#F4D03F" stroke-width="2"/>
  <path d="M154 100 L158 110" stroke="#F4D03F" stroke-width="2"/>
  
  <circle cx="170" cy="80" r="6" fill="#F4D03F"/>
  <path d="M170 86 L170 105" stroke="#F4D03F" stroke-width="3"/>
  <path d="M162 95 L178 95" stroke="#F4D03F" stroke-width="3"/>
  <path d="M166 105 L162 115" stroke="#F4D03F" stroke-width="2"/>
  <path d="M174 105 L178 115" stroke="#F4D03F" stroke-width="2"/>
  
  <!-- Group 3 -->
  <circle cx="230" cy="85" r="7" fill="#F4D03F"/>
  <path d="M230 92 L230 112" stroke="#F4D03F" stroke-width="3.5"/>
  <path d="M220 100 L240 100" stroke="#F4D03F" stroke-width="3.5"/>
  <path d="M225 112 L220 122" stroke="#F4D03F" stroke-width="2.5"/>
  <path d="M235 112 L240 122" stroke="#F4D03F" stroke-width="2.5"/>
  
  <circle cx="260" cy="80" r="7" fill="#F4D03F"/>
  <path d="M260 87 L260 107" stroke="#F4D03F" stroke-width="3.5"/>
  <path d="M250 95 L270 95" stroke="#F4D03F" stroke-width="3.5"/>
  <path d="M255 107 L250 117" stroke="#F4D03F" stroke-width="2.5"/>
  <path d="M265 107 L270 117" stroke="#F4D03F" stroke-width="2.5"/>
  
  <!-- Group 4 - children -->
  <circle cx="300" cy="90" r="5" fill="#F4D03F"/>
  <path d="M300 95 L300 110" stroke="#F4D03F" stroke-width="2.5"/>
  <path d="M293 100 L307 100" stroke="#F4D03F" stroke-width="2.5"/>
  <path d="M296 110 L293 118" stroke="#F4D03F" stroke-width="2"/>
  <path d="M304 110 L307 118" stroke="#F4D03F" stroke-width="2"/>
  
  <circle cx="320" cy="85" r="5" fill="#F4D03F"/>
  <path d="M320 90 L320 105" stroke="#F4D03F" stroke-width="2.5"/>
  <path d="M313 95 L327 95" stroke="#F4D03F" stroke-width="2.5"/>
